plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.piezmaker'
    compileSdk 35

    defaultConfig {
        applicationId "com.piezmaker"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    signingConfigs {
        release {
            storeFile file('../piez-key.jks')
            storePassword 'piezmaker123'
            keyAlias 'piez'
            keyPassword 'piezmaker123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // 零第三方依赖：录制/播放/ZIP 全部使用系统 API
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}